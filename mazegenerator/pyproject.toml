[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegenerator"
version = "1.0.0"
description = "Reusable maze generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
	{ name = "Guillermo Muñoz Diaz" },
	{ name = "Sara Vaquerizo" }
]

[tool.setuptools]
py-modules = ["mazegenerator"]